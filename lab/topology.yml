# The lab of the Inmanta tutorials: the orchestrator, its database, three SR Linux routers and one subscriber.
name: inmanta-tutorial
mgmt:
  network: inmanta-tutorial
  ipv4-subnet: 172.30.0.0/16
topology:
  kinds:
    srl:
      image: ghcr.io/nokia/srlinux:26.7.2
  nodes:
    inmanta-server:
      kind: linux
      image: ghcr.io/inmanta/orchestrator:2027.2
      mgmt-ipv4: 172.30.0.3
      env:
        INMANTA_DATABASE_HOST: inmanta-db
        INMANTA_DATABASE_USERNAME: inmanta
        INMANTA_DATABASE_PASSWORD: inmanta
    inmanta-db:
      kind: linux
      image: docker.io/library/postgres:16
      mgmt-ipv4: 172.30.0.2
      env:
        POSTGRES_USER: inmanta
        POSTGRES_PASSWORD: inmanta
    spine:
      kind: srl
      type: ixr-d2
      mgmt-ipv4: 172.30.0.100
    leaf1:
      kind: srl
      type: ixr-d2
      mgmt-ipv4: 172.30.0.210
    leaf2:
      kind: srl
      type: ixr-d2
      mgmt-ipv4: 172.30.0.220
    subscriber-east:
      kind: linux
      image: docker.io/inmantaci/nfv-test-api:2.7.7
      mgmt-ipv4: 172.30.0.6
  links:
    - endpoints: ["spine:e1-1", "leaf1:e1-1"]
    - endpoints: ["spine:e1-2", "leaf2:e1-1"]
